# What Prometheus collects (02 7.5). Batch steps (monitoring, training, feedback)
# push to the Pushgateway because they end before a scrape would reach them;
# the prediction service runs all the time, so it is scraped directly.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: serving
    static_configs:
      - targets: ["serving:8000"]

  - job_name: pushgateway
    # Keep the job and model labels the steps pushed, instead of replacing
    # them with this scrape's own.
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
