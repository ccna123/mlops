[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-common"
version = "0.1.0"
description = "Shared logic for the MLOps house pricing pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.0,<4",
    "pyarrow>=16",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "moto[s3]>=5.0",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

# Ruff is configured once for the whole repo, in ../ruff.toml. No [tool.ruff]
# section here on purpose: one would shadow that file for everything under
# common/ and let the two drift apart.
