name: mlops

services:
  postgres:
    image: postgres:16-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO removed its Docker Hub images; quay.io is now the official registry.
    image: quay.io/minio/minio:latest
    container_name: mlops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/${ML_BUCKET} &&
      echo 'Bucket ${ML_BUCKET} ready'
      "

  mlflow:
    build: ./docker/mlflow
    container_name: mlops-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MINIO_ENDPOINT_INTERNAL}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    command:
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --default-artifact-root=s3://${ML_BUCKET}/artifacts/
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.10.3-python3.12
    container_name: mlops-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MINIO_ENDPOINT_INTERNAL: ${MINIO_ENDPOINT_INTERNAL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      ML_BUCKET: ${ML_BUCKET}
      SAMPLE_ROWS: ${SAMPLE_ROWS}
      SERVING_URL: ${SERVING_URL}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: >
      /bin/bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-scheduler:
    image: apache/airflow:2.10.3-python3.12
    container_name: mlops-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker==3.14.0
    # LocalExecutor runs tasks inside the scheduler, so this is the only service
    # that needs the Docker socket. The leading double slash is required on
    # Windows: without it the path is rewritten to a Windows path and the mount
    # silently points at nothing.
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - //var/run/docker.sock:/var/run/docker.sock
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    image: apache/airflow:2.10.3-python3.12
    container_name: mlops-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  serving:
    build:
      context: .
      dockerfile: services/serving/Dockerfile
    image: ml-serving:latest
    container_name: mlops-serving
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT_INTERNAL: ${MINIO_ENDPOINT_INTERNAL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      ML_BUCKET: ${ML_BUCKET}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      # MLflow reaches MinIO through boto3, which reads the AWS names, not the
      # MINIO ones. Without these three, loading a model's artifact fails with
      # AccessDenied while the tracking call succeeds.
      MLFLOW_S3_ENDPOINT_URL: ${MINIO_ENDPOINT_INTERNAL}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    image: ml-agent:latest
    # profiles keeps this OFF by default. `docker compose up` does not start
    # it; only `docker compose --profile agent up -d` does. A 16GB machine is
    # already running Airflow, Postgres, MinIO, MLflow and serving.
    profiles: ["agent"]
    depends_on:
      - serving
    environment:
      MINIO_ENDPOINT_INTERNAL: ${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      ML_BUCKET: ${ML_BUCKET:-ml-pipeline}
      SERVING_URL: http://serving:8000
      DATASET_VERSION: ${DATASET_VERSION:-v1}
      AGENT_SCENARIO: ${AGENT_SCENARIO:-none}
      AGENT_TASK_TYPE: ${AGENT_TASK_TYPE:-regression}
      AGENT_COUNT: ${AGENT_COUNT:-200}
      AGENT_INTERVAL_SECONDS: ${AGENT_INTERVAL_SECONDS:-300}
    command:
      - sh
      - -c
      - |
        while true; do
          python -m services.agent \
            --scenario "$$AGENT_SCENARIO" \
            --task-type "$$AGENT_TASK_TYPE" \
            --count "$$AGENT_COUNT" \
            --seed "$$(date +%s)" || true
          sleep "$$AGENT_INTERVAL_SECONDS"
        done

volumes:
  postgres-data:
  minio-data:
